{% extends "v7/layouts/main_idv_quick_reference_rep.html" %}

{% block pageTitle %}
  Are you an official representative – {{ serviceName }}
{% endblock %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <form action="/v7/representative/are-you-an-official-representative" method="post">

      <div class="govuk-form-group">

        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <h1 class="govuk-fieldset__heading">
              Are you an official representative?
            </h1>
          </legend>

          <div class="govuk-radios" data-module="govuk-radios">

            <div class="govuk-radios__item">
              <input class="govuk-radios__input"
                id="repAnswer"
                name="repAnswer"
                type="radio"
                value="yesrep">
              <label class="govuk-label govuk-radios__label" for="repAnswer">
                Yes
              </label>
            </div>

            <div class="govuk-radios__item">
              <input class="govuk-radios__input"
                id="repAnswer-2"
                name="repAnswer"
                type="radio"
                value="no">
              <label class="govuk-label govuk-radios__label" for="repAnswer-2">
                No
              </label>
            </div>

            <div class="govuk-radios__item">
              <input class="govuk-radios__input"
                id="repAnswer-3"
                name="repAnswer"
                type="radio"
                value="dont-know">
              <label class="govuk-label govuk-radios__label" for="repAnswer-3">
                I do not know
              </label>
            </div>

          </div>

        </fieldset>

      </div>

      {{ govukButton({
        text: "Continue"
      }) }}

    </form>

  </div>
</div>

{% endblock %}
